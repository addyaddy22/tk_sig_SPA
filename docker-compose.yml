services:
  db:
    build:
      context: ./docker/postgres
    image: tk-sig-spa-postgres:16
    container_name: tk_sig_spa_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spa_password}
      POSTGRES_DB: ${POSTGRES_DB:-tk_sig_spa}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    name: tk_sig_spa_pgdata
